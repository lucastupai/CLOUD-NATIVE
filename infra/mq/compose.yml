services:
  rabbitmq1:
    image: rabbitmq:4.2-management
    container_name: vidasalud-mq-node1
    hostname: rabbitmq1
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP protocolo estándar
      - "15672:15672"     # Consola web RabbitMQ Management
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-VIDASALUD_SECRET_COOKIE_2026}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vidasalud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vidasalud-local}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
    networks:
      - mq-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq2:
    image: rabbitmq:4.2-management
    container_name: vidasalud-mq-node2
    hostname: rabbitmq2
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-VIDASALUD_SECRET_COOKIE_2026}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vidasalud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vidasalud-local}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    networks:
      - mq-network
    depends_on:
      rabbitmq1:
        condition: service_healthy

volumes:
  rabbitmq1_data:
  rabbitmq2_data:

networks:
  mq-network:
    driver: bridge
