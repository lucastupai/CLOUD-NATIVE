services:
  catalog:
    build:
      context: ../../ms-vidasalud-catalog
      dockerfile: Dockerfile
    image: vidasalud/catalog:1.0.0
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud}
      DB_URL: ${CATALOG_DB_URL:-jdbc:h2:mem:catalog;MODE=Oracle;DB_CLOSE_DELAY=-1}
      DB_USER: ${CATALOG_DB_USER:-sa}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-}

  appointments:
    build:
      context: ../../ms-vidasalud-appointments
      dockerfile: Dockerfile
    image: vidasalud/appointments:1.0.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud}
      DB_URL: ${APPOINTMENTS_DB_URL:-jdbc:h2:mem:appointments;MODE=Oracle;DB_CLOSE_DELAY=-1}
      DB_USER: ${APPOINTMENTS_DB_USER:-sa}
      DB_PASSWORD: ${APPOINTMENTS_DB_PASSWORD:-}
      CATALOG_URL: http://catalog:8082
      RABBITMQ_ENABLED: "true"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-127.0.0.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-vidasalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vidasalud-local}
      RABBITMQ_DIRECT_EXCHANGE: cmd.direct
      RABBITMQ_TOPIC_EXCHANGE: cmd.topic
    depends_on:
      - catalog

  notifications:
    build:
      context: ../../ms-vidasalud-notifications
      dockerfile: Dockerfile
    image: vidasalud/notifications:1.0.0
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-127.0.0.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-vidasalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vidasalud-local}
      RABBITMQ_EXCHANGE_DIRECT: cmd.direct
      RABBITMQ_EXCHANGE_TOPIC: cmd.topic
      RABBITMQ_EXCHANGE_DLX: cmd.dead.dlx
      RABBITMQ_QUEUE_EMAIL: q.cmd.email
      RABBITMQ_QUEUE_EMAIL_DLQ: q.cmd.email.dlq
      RABBITMQ_QUEUE_ADMISSION: q.cmd.admission
      RABBITMQ_QUEUE_ADMISSION_DLQ: q.cmd.admission.dlq
      RABBITMQ_QUEUE_RECORD: q.cmd.record
      RABBITMQ_QUEUE_RECORD_DLQ: q.cmd.record.dlq

  rabbit-admin:
    build:
      context: ../../ms-vidasalud-rabbit-admin
      dockerfile: Dockerfile
    image: vidasalud/rabbit-admin:1.0.0
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-127.0.0.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-vidasalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vidasalud-local}
      RABBIT_ADMIN_KEY: ${RABBIT_ADMIN_KEY:-vidasalud-admin-local-2026-key}

  bff:
    build:
      context: ../../ms-vidasalud-bff
      dockerfile: Dockerfile
    image: vidasalud/bff:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-d6edb470-bae6-41a0-b8c5-c2f55613b833}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-2590980d-413c-42a8-a1c7-fc1289f4fb44}
      APPOINTMENTS_URL: http://appointments:8081
      CATALOG_URL: http://catalog:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      - appointments
      - catalog
